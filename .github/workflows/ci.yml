name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate manifests and skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Skill frontmatter matches directory name
        # Each skills/<name>/SKILL.md must declare `name: <name>` in its
        # YAML frontmatter — mismatches break the Skills CLI and the plugins
        # that vendor these skills, and they're easy to introduce in a rename.
        run: |
          set -euo pipefail
          fail=0
          for skill_dir in skills/*/; do
            name=$(basename "$skill_dir")
            skill_md="$skill_dir/SKILL.md"
            if [[ ! -f "$skill_md" ]]; then
              echo "missing SKILL.md: $skill_md" >&2
              fail=1
              continue
            fi
            declared=$(awk '/^---$/{c++; next} c==1 && /^name:/{print $2; exit}' "$skill_md")
            if [[ "$declared" != "$name" ]]; then
              echo "name mismatch in $skill_md: declared '$declared' vs dir '$name'" >&2
              fail=1
            else
              echo "ok: $skill_md (name: $declared)"
            fi
          done
          exit "$fail"

      - name: JSON config parses
        run: |
          set -euo pipefail
          for f in release-please-config.json .release-please-manifest.json renovate.json; do
            jq . "$f" >/dev/null
            echo "ok: $f"
          done
