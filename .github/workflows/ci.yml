name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate manifests and skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate JSON manifests
        run: |
          set -euo pipefail
          for f in .claude-plugin/plugin.json .claude-plugin/marketplace.json; do
            jq . "$f" >/dev/null
            echo "ok: $f"
          done

      - name: Skill frontmatter matches directory name
        # Each skills/<name>/SKILL.md must declare `name: <name>` in its
        # YAML frontmatter — mismatches break the Skills CLI and the plugin
        # marketplace registry, and they're easy to introduce in a rename.
        run: |
          set -euo pipefail
          fail=0
          for skill_dir in skills/*/; do
            name=$(basename "$skill_dir")
            skill_md="$skill_dir/SKILL.md"
            if [[ ! -f "$skill_md" ]]; then
              echo "missing SKILL.md: $skill_md" >&2
              fail=1
              continue
            fi
            declared=$(awk '/^---$/{c++; next} c==1 && /^name:/{print $2; exit}' "$skill_md")
            if [[ "$declared" != "$name" ]]; then
              echo "name mismatch in $skill_md: declared '$declared' vs dir '$name'" >&2
              fail=1
            else
              echo "ok: $skill_md (name: $declared)"
            fi
          done
          exit "$fail"

      - name: Plugin manifest name matches marketplace entry
        run: |
          set -euo pipefail
          plugin_name=$(jq -r .name .claude-plugin/plugin.json)
          marketplace_name=$(jq -r '.plugins[0].name' .claude-plugin/marketplace.json)
          if [[ "$plugin_name" != "$marketplace_name" ]]; then
            echo "plugin.name '$plugin_name' != marketplace.plugins[0].name '$marketplace_name'" >&2
            exit 1
          fi
          echo "ok: plugin/marketplace agree on '$plugin_name'"

  test-installer:
    name: Test install.sh script (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run installer script
        run: |
          bash scripts/install.sh

